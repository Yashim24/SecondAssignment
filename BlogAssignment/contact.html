      <style>
    ody{
    width: 100%;
    background-color: rgb(216, 178, 24);
}
.header{
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 80px;
    background-color: #e3e6f3;
    box-shadow: 0 5px 15px rgba(0, 0, 0, 0.06);
    z-index: 999;
    position: sticky;
    top: 0;
    left: 0;
}
.header:hover{
    box-shadow: 50px 50px 54px rgba(68, 9, 231, 0);
    color: #c42121;
}
#navbar{
    display: flex;
    ruby-align: right;
    border: palegreen;
    border-radius: 25px;
}
#navbar li{
    list-style: none;
    padding: 0 25px;
    align-content: baseline;
    ruby-align: right;
    
}
#navbar li a{
    text-decoration: none;
    font-size: 15px;
    font-weight: 600;
    color: rgba(85, 12, 202, 0.555);
    transition: 0.3s ease;
    ruby-align: right;
}
#navbar li a:hover,
#navbar li a.active{
    color: blue;
}
#navbar li a.active::after,
#navbar li a:hover::after{
    content: "";
    width: 30%;
    height: 2px;
    background: blue;
    position: absolute;
    bottom: -4px;
    left: 20px;
}
.header h1{
font-size: 40px;
flex-wrap: wrap;
align-items: center;
font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
color:blue;
padding: 30px, 30px, 20px, 20px;
padding-bottom: 50px;
}

</style>
